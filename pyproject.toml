[project]
name = "comparativa"
version = "0.1.0"
description = "All-Python reference pipeline that parses Fountain screenplays and generates episode audio with MLX speech models, for controlled comparison against the Swift stack."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "mlx-audio==0.4.8",
    "jouvence==0.4.2",
    "psutil==7.2.2",
    "pyloudnorm==0.2.0",
    "soundfile==0.14.0",
    "numpy==2.5.2",
    "misaki[en]>=0.9.4",
]

[project.scripts]
comparativa = "comparativa.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comparativa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
